<!DOCTYPE html>
<html>
<head>
    <title>Asmi Mart - AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }

        .chat-box {
            width: 400px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        h2 {
            font-size: 24px;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="chat-box">

        <h1>Asmi Mart</h1>

        <h2>AI Chatbot</h2>

        <form method="post"
              action="http://localhost:8080/fashionstore-backend/chatbot">

            <input type="text"
                   name="message"
                   placeholder="Ask something..."
                   required>

            <button type="submit">Send</button>

        </form>

    </div>

</body>
</html>
