<!DOCTYPE html>
<html>
<head>
    <title>Seller Login - Asmi Mart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .login-box {
            width: 350px;
            margin: auto;
        }

        h1 {
            font-size: 32px;
        }

        h2 {
            font-size: 24px;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-size: 16px;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Asmi Mart</h1>
        <h2>Seller Login</h2>

        <form method="post"
              action="http://localhost:8080/fashionstore-backend/seller-login">

            <label>Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter seller email"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
