<!DOCTYPE html>
<html>
<head>
    <title>Asmi Mart - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-login-card {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .admin-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 22px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .admin-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .back-login {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="admin-login-card">

        <div class="admin-icon">⚙️</div>

        <h1>Asmi Mart</h1>

        <h2>Admin Portal</h2>

        <p class="admin-subtitle">
            Login to manage your fashion store
        </p>

        <form method="post"
              action="http://localhost:8080/fashionstore-backend/admin-login">

            <label for="email">Email Address</label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter Admin Email"
                   required>

            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Enter Admin Password"
                   required>

            <button type="submit">
                Admin Login
            </button>

        </form>

        <a href="index.html" class="back-login">
            ← Back to User Login
        </a>

    </div>

</body>
</html>
