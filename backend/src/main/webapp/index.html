<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AsmiMart - Login</title>

    <link rel="stylesheet"
          href="style.css">
          <link rel="stylesheet"href="ui/theme.css">

</head>


<body class="asmi-login-page">


    <!-- MAIN LOGIN CONTAINER -->

    <div class="asmi-login-wrapper">


        <!-- ==============================
             LEFT LOGIN SECTION
             ============================== -->

        <section class="asmi-login-section">


            <!-- LOGO -->

            <div class="asmi-login-logo">
                Asmi<span>Mart</span>
            </div>


            <!-- TITLE -->

            <h1 class="asmi-login-title">
                Login
            </h1>

            <p class="asmi-login-subtitle">
                Welcome back! Please login to continue.
            </p>


            <!-- GOOGLE BUTTON -->

            <button type="button"
                    class="asmi-google-button">

                <span class="google-letter">
                    G
                </span>

                Sign in with Google

            </button>


            <!-- DIVIDER -->

            <div class="asmi-divider">

                <span></span>

                <p>Or sign in with email</p>

                <span></span>

            </div>


            <!-- LOGIN FORM -->

            <form
                class="asmi-login-form"
                method="post"
                action="http://localhost:8080/fashionstore-backend/login">


                <!-- EMAIL -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- OPTIONS -->

                <div class="asmi-login-options">


                    <label class="remember-option">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Keep me logged in
                        </span>

                    </label>


                    <a href="#"
                       class="forgot-password">

                        Forgot password?

                    </a>


                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="asmi-login-button">

                    Login

                </button>


            </form>


            <!-- REGISTER -->

            <p class="asmi-register-text">

                Don't have an account?

                <a href="register.html">
                    Sign up
                </a>

            </p>


        </section>



        <!-- ==============================
             RIGHT DESIGN SECTION
             ============================== -->

        <section class="asmi-login-art">


            <!-- DECORATIVE SHAPES -->

            <div class="art-shape shape-purple-top"></div>

            <div class="art-shape shape-pink-top"></div>

            <div class="art-shape shape-orange-top"></div>

            <div class="art-shape shape-purple-right"></div>

            <div class="art-shape shape-pink-bottom"></div>

            <div class="art-shape shape-blue-bottom"></div>


            <!-- DOT PATTERN -->

            <div class="art-dots"></div>


            <!-- MAIN MESSAGE -->

            <div class="asmi-art-content">

                <p class="art-small-title">
                    ASMI MART
                </p>

                <h2>
                    Changing the way
                    <br>
                    you experience
                    <br>
                    <span>fashion.</span>
                </h2>

                <p class="art-description">
                    Discover beautiful styles,
                    fresh trends and fashion
                    made for you.
                </p>

            </div>


            <!-- FASHION CARD -->

            <div class="mini-fashion-card">

                <span>
                    NEW
                </span>

                <strong>
                    STYLE
                </strong>

                <small>
                    COLLECTION
                </small>

            </div>


        </section>


    </div>


</body>

</html>
